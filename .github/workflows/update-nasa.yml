
name: Update NASA Solar Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch NASA solar flare data
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python update_nasa_data.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/solar_flares.json
          git diff --cached --quiet || git commit -m "Update NASA solar data"
          git push
